<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro HTML</title>
    <style>
        a {
            display: inline-block;
        }

        div {
            background-color: blue;
            width: 70px;
            height: 50px;
            text-align: center;
            color: white;
        }

        main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        span {
            position: absolute  ;
        }
    </style>
</head>

<body>

    <nav>
        <a href="">lien 1</a>
        <a href="">lien 2</a>
        <a href="">lien 3</a>
        <a href="">lien 4</a>
    </nav>

    <main>
        <div>1</div>
        <div style="height: 25px;">2</div>
        <div>3</div>
    </main>

    <section>
        <p>
            Lorem ipsum dolor sit <span>amet</span> consectetur adipisicing elit. Cumque, culpa!
        </p>
    </section>


</body>

</html>
