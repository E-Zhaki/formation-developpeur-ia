<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            border: 1px solid black;
            color: white;
        }

        thead {
            background-color: black;
            color: white;
        }

        tbody tr:nth-child(even){
            background-color: rgb(138, 206, 206);
        }

        tbody tr:nth-child(odd){
            background-color: rgb(205, 190, 197);
        }

        div {
            overflow-x: auto;
        }

    </style>
</head>

<body>
    <div>
        <table>
            <caption>Liste d'apprenants</caption>
            <thead>
                <tr>
                    <th>Horaire</th>
                    <th>Lundi</th>
                    <th>Mardi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>9h</td>
                    <td rowspan="2">Bootstrap</td>
                    <td>formulaire</td>
                </tr>
                <tr>
                    <td>11h</td>
                    <td>Atelier</td>
                </tr>
                    <td>14h</td>
                    <td colspan="2">tableaux</td>
                </tr>

            </tbody>
        </table>
    </div>
</body>
</html>
