<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saisie et types — JavaScript</title>
</head>
<body>
    <p><a href="../index.html">Retour au sommaire JavaScript</a></p>
    <h1>Saisie et types</h1>
    <p>Demander un prénom et un âge avec <code>prompt()</code>, puis observer leur type avec <code>typeof</code>.</p>
    <p>Les réponses saisies dans ces deux exemples sont du texte.</p>
    <p>Les affichages de <code>console.log()</code> se lisent dans la console du navigateur (F12).</p>

    <script>
        let prenom = prompt ("Entrer un prénom");
        let age = prompt ("Entrer un age");

        console.log (typeof age);
        console.log (typeof prenom);
    </script>
</body>
</html>
