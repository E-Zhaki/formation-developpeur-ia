<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables et types — JavaScript</title>
</head>
<body>
    <p><a href="../index.html">Retour au sommaire JavaScript</a></p>
    <h1>Variables et types</h1>
    <p>Exemple du cours : déclarer du texte, des nombres et un booléen avec <code>let</code>.</p>
    <p>Les affichages de <code>console.log()</code> se lisent dans la console du navigateur (F12).</p>

    <script>
        let prenom = "Mihai";
        let age = 20;
        let prix = 29.9;
        let isPresent = true; // false

        console.log(prenom, age, prix, isPresent);
    </script>
</body>
</html>
