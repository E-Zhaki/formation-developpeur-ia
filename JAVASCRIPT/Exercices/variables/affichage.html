<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afficher des variables — JavaScript</title>
</head>
<body>
    <p><a href="../index.html">Retour au sommaire JavaScript</a></p>
    <h1>Afficher des variables</h1>
    <p>Exemples du cours : afficher des variables par concaténation et avec les expressions <code>${...}</code>.</p>
    <p>Les affichages de <code>console.log()</code> se lisent dans la console du navigateur (F12).</p>

    <script>
        console.log("Debut du programme");
        let prenom = "Mihai";
        let age = 20;

        console.log("prenom: " + prenom + "age: " + age );
        console.log(`prénom ${prenom}, mon âge ${age}`);
    </script>
</body>
