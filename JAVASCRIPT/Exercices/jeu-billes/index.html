<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de billes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="app.js" defer></script>
    <style>
        #progression {
            border: 1px solid blue;
            border-radius: 10px;
            background-color: #e4f3ed47;
        }

        .progression {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background-color: #190ad0;
        }
    </style>
</head>

<body>
    <header class="bg-secondary text-center p-3">
        <h1>Jeu de bille</h1>
    </header>
    <main class="container my-5">
        <form action="">
            <h2 class="text-center">Inscription</h2>
            <div class="d-flex justify-content-around">
                <div>
                    <label for="">Prénom joueur 1</label>
                    <input type="text" id="joueur1" required value="Toto">
                </div>
                <div>
                    <label for="">Prénom joueur 2</label>
                    <input type="text" id="joueur2" required value="Tata">
                </div>
            </div>
            <div class="m-3">
                <label for="">Nombre de bille</label>
                <input type="number" id="nbBille" class="form-control" required value="7">
            </div>
            <input type="submit" class="btn btn-success">
        </form>

        <!-- Gestion des tours -->
        <div class="card p-3 mt-3 d-none" id="jeu">
            <h2 class="text-center">Gestion du tour par tour</h2>
            <div id="bille"></div>
            <div class="mt-3" id="progression">
                <div class="progression"></div>
            </div>
            <div class="d-flex justify-content-between my-2">
                <span id="precedent">Coup précédent : 0</span>
                <span id="reste">Billes restantes : 10</span>
            </div>

            <div>
                <strong id="joueurActif">toto</strong> à toi de jouer
            </div>

            <div class="d-flex my-3 gap-3 justify-content-center" id="btn">
                <button class="btn btn-success">1</button>
                <button class="btn btn-success">2</button>
                <button class="btn btn-success">3</button>
            </div>

        </div>

        <div class="card my-3 p-3 d-none" id="fin">
            <h2 class="text-center">GAME OVER</h2>
            <div>
                Fin du jeu ! Le joueur <strong id="gagnant">Toto</strong> a gagné la partie 🎮
            </div>
            <div class="d-flex justify-content-evenly">
                <div id="j1"></div>
                <div id="j2"></div>
            </div>
        </div>

    </main>
</body>

</html>
