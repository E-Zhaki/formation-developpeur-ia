<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Poids idéal — correction du cours</title>
</head>

<body class="container">
    <h1>Poids idéal</h1>

    <form action="">
        <div class="mb-3">
            <label for="">Sexe : </label>
            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input" name="sexe" id="femme" value="femme">
                <label for="femme">Femme</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input" name="sexe" id="homme" value="homme">
                <label for="homme">Homme</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="">Taille</label>
            <input type="number" class="form-control" id="taille">
        </div>

        <div class="mb-3">
            <label for="">Âge</label>
            <input type="number" class="form-control" id="age">
        </div>

        <button class="mt-3 btn btn-success">Valider</button>

    </form>

    <div id="resultat" class="mt-3 alert alert-success d-none"></div>


    <script>
        const form = document.querySelector("form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const taille = Number(document.getElementById("taille").value);
            const age = Number(document.getElementById("age").value);
            const sexe = document.querySelector('input[name="sexe"]:checked').value

            let poids;

            if (sexe == "homme") {
                poids = (3 * taille - 250) * (age + 270) / 1200
            } else {
                poids = (taille / 2 - 30) * (180 + age) / 200
            }

            let resultat = document.getElementById("resultat");

            resultat.classList.remove("d-none");
            resultat.textContent = "Votre poids idéal est de " + poids.toFixed(2) + " KG. Pour " + age + " ans de sexe " + sexe;

        });

    </script>

</body>

</html>
