<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition de deux nombres — JavaScript</title>
</head>
<body>
    <p><a href="../index.html">Retour au sommaire JavaScript</a></p>
    <h1>Addition de deux nombres</h1>
    <p>Demander deux nombres, convertir les saisies avec <code>Number()</code> et afficher leur somme.</p>
    <p>Les affichages de <code>console.log()</code> se lisent dans la console du navigateur (F12).</p>

    <script>
        let x = prompt ("Entrer de x: ");
        let y = prompt ("Entrer de y: ");

        let resultat = Number(x) + Number(y);

        console.log (resultat);

        // Autre expression vue en cours : (x * 3) + 1;
    </script>
</body>
</html>
