<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparer des valeurs — JavaScript</title>
</head>
<body>
    <p><a href="../index.html">Retour au sommaire JavaScript</a></p>
    <h1>Comparer des valeurs</h1>
    <p>Comparer le nombre <code>5</code> et le texte <code>"5"</code> avec <code>==</code> puis <code>===</code>.</p>
    <p>Les affichages de <code>console.log()</code> se lisent dans la console du navigateur (F12).</p>

    <script>
        let a = 5;
        let b = "5";

        console.log (a == b);
        console.log (a === b);
    </script>
</body>
</html>
